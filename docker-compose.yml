services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: etkinlik-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - etkinlik-network

  postgres:
    image: postgres:alpine
    container_name: etkinlik-postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=Password123!
      - POSTGRES_DB=FollowerDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - etkinlik-network

  mongo:
    image: mongo:latest
    container_name: etkinlik-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=Password123!
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - etkinlik-network

  redis:
    image: redis:alpine
    container_name: etkinlik-redis
    ports:
      - "6379:6379"
    networks:
      - etkinlik-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: etkinlik-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - etkinlik-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: etkinlik-keycloak
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloakdb
      - KC_DB_USERNAME=admin
      - KC_DB_PASSWORD=Password123!
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/realm-export.json
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - etkinlik-network

  eventcatalogservice:
    build:
      context: ./src/Services/EventCatalogService
      dockerfile: Dockerfile
    container_name: etkinlik-eventcatalogservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDB__ConnectionString=mongodb://admin:Password123!@mongo:27017
      - MongoDB__DatabaseName=EventCatalogDb
      - Redis__ConnectionString=redis:6379
      - Keycloak__Authority=http://keycloak:8080/realms/etkinlik-radar
      - Keycloak__Audience=eventcatalog-api
    ports:
      - "5002:8080"
    depends_on:
      - mongo
      - redis
      - keycloak
    networks:
      - etkinlik-network

  followerservice:
    build:
      context: ./src/Services/FollowerService
      dockerfile: Dockerfile
    container_name: etkinlik-followerservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=FollowerDb;Username=admin;Password=Password123!
      - Keycloak__Authority=http://keycloak:8080/realms/etkinlik-radar
      - Keycloak__Audience=follower-api
    ports:
      - "5003:8080"
    depends_on:
      - postgres
      - keycloak
    networks:
      - etkinlik-network

  scraperservice:
    build:
      context: ./src/Services/ScraperService
      dockerfile: Dockerfile
    container_name: etkinlik-scraperservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - MongoDB__ConnectionString=mongodb://admin:Password123!@mongo:27017
      - MongoDB__DatabaseName=EventCatalogDb
      - Keycloak__Authority=http://keycloak:8080/realms/etkinlik-radar
      - Keycloak__Audience=scraper-api
    ports:
      - "5004:8080"
    depends_on:
      - rabbitmq
      - mongo
      - keycloak
    networks:
      - etkinlik-network

  blazorapp:
    build:
      context: ./src/Clients/BlazorApp
      dockerfile: Dockerfile
    container_name: etkinlik-blazorapp
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Keycloak__Authority=http://localhost:8080/realms/etkinlik-radar
      - Keycloak__ClientId=blazor-client
    ports:
      - "5000:8080"
    depends_on:
      - keycloak
    networks:
      - etkinlik-network

  nginx:
    image: nginx:alpine
    container_name: etkinlik-nginx
    volumes:
      - ./src/Gateways/Nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - eventcatalogservice
      - followerservice
      - blazorapp
    networks:
      - etkinlik-network

networks:
  etkinlik-network:
    driver: bridge

volumes:
  sqlserver_data:
  postgres_data:
  mongo_data:
