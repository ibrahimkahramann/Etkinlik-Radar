events {
    worker_connections 1024;
}

http {
    upstream identity_service {
        server keycloak:8080;
    }

    upstream event_service {
        server eventcatalogservice:8080;
    }

    upstream follower_service {
        server followerservice:8080;
    }

    upstream scraper_service {
        server scraperservice:8080;
    }

    # upstream blazor_app {
    #     server blazorapp:8080;
    # }

    server {
        listen 80;

        # location / {
        #     proxy_pass http://blazor_app;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection keep-alive;
        #     proxy_set_header Host $host;
        #     proxy_cache_bypass $http_upgrade;
        # }

        location /api/identity {
            # CORS Headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://identity_service;
            proxy_set_header Host $host;
        }

        location /api/events {
            # CORS Headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://event_service;
            proxy_set_header Host $host;
        }

        location /api/followers {
            # CORS Headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://follower_service;
            proxy_set_header Host $host;
        }

        location /api/scraper {
            # CORS Headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://scraper_service;
            proxy_set_header Host $host;
        }
    }
}
